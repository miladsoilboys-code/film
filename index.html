<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎬 داشبورد فیلم</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:tahoma;
background:#0f172a;
color:#fff;
padding:30px;
}

h1{
text-align:center;
margin-bottom:20px;
font-size:32px;
}

#search{
width:100%;
max-width:500px;
display:block;
margin:0 auto 30px;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
outline:none;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
transition:.3s;
border:1px solid #334155;
text-align:center;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 12px 30px rgba(0,0,0,.4);
border-color:#3b82f6;
}

.card img{
width:48px;
height:48px;
margin-bottom:12px;
}

.card h3{
margin-bottom:15px;
}

.card a{
display:inline-block;
padding:10px 20px;
background:#2563eb;
color:#fff;
text-decoration:none;
border-radius:8px;
}

.card a:hover{
background:#1d4ed8;
}
</style>

</head>

<body>

<h1>🎬 داشبورد فیلم</h1>

<input id="search" placeholder="جستجوی سایت...">

<div class="grid" id="grid">

</div>

<script>

const sites=[
["Kargadan Movie","https://www.kargadanmovie.com"],
["UncutMovie","https://uncutmovie.org"],
["KimoLand","https://kimoland.com"],
["HashtagFilm","https://hashtagfilm.site"],
["دنیای سریال","https://donyayeserial.com"],
["AlmasMovie","https://almasmovie.website"],
["MoboMovies","https://mobomovies.co"],
["Cinema Tika","https://cinema-tika.com"]
];

const grid=document.getElementById("grid");

function render(list){

grid.innerHTML="";

list.forEach(site=>{

let domain=(new URL(site[1])).hostname;

grid.innerHTML+=`
<div class="card">
<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64">
<h3>${site[0]}</h3>
<a href="${site[1]}" target="_blank">ورود به سایت</a>
</div>
`;

});

}

render(sites);

document.getElementById("search").addEventListener("input",e=>{

let txt=e.target.value.toLowerCase();

render(sites.filter(s=>s[0].toLowerCase().includes(txt)));

});

</script>

</body>
</html>
